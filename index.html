<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VPK Innovation</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="VPK Innovation Co., Ltd. — design, build and install industrial automation machinery. No Quality, No Work · Plug & Play. Thailand.">
<link rel="icon" href="images/vpk-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Sarabun:wght@400;500;600;700&family=Prompt:wght@600;700&family=Noto+Sans+JP:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap">
<style>
/* VPK Innovation — matches Company Profile 2026: charcoal + amber, condensed type, angular slashes */
:root{
  --amb:#F5B400; --amb-d:#8C6500; --ink:#212830; --ink2:#2E3743; --mut:#545A65; --soft:#C9CDD4;
  --light:#F2F3F5; --line:#DCDFE4; --bg:#FFFFFF;
  --f-head:"Barlow Condensed","Prompt","Arial Narrow",sans-serif;
  --f-body:"Barlow","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html[lang="ja"]{--f-head:"Barlow Condensed","Noto Sans JP",sans-serif;--f-body:"Barlow","Noto Sans JP",sans-serif}
html[lang="zh-CN"]{--f-head:"Barlow Condensed","Noto Sans SC",sans-serif;--f-body:"Barlow","Noto Sans SC",sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--mut);font:16px/1.65 var(--f-body);overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:var(--f-head);color:var(--ink);margin:0;line-height:1.02;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--amb);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:24px;position:relative}
@media (max-width:480px){.wrap{padding-inline:16px}}
section{position:relative}

/* type */
.eyebrow{display:flex;align-items:center;gap:10px;font:700 13px/1.2 var(--f-head);letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.eyebrow::before{content:"";width:20px;height:10px;background:var(--amb);transform:skewX(-20deg);flex:none}
.on-dark .eyebrow{color:var(--soft)}
.h2{font-size:clamp(40px,6vw,68px);font-weight:800;text-transform:uppercase;letter-spacing:.005em;margin-top:14px}
.h2 span{display:block;color:var(--amb)}
.on-dark h2,.on-dark h3{color:#fff}
.lead{font-size:17px;max-width:44em;margin-top:18px}
.on-dark .lead,.on-dark p{color:var(--soft)}
.tag{display:inline-flex;transform:skewX(-16deg);background:var(--amb);padding:5px 12px;width:fit-content}
.tag>span{transform:skewX(16deg);font:700 12px/1.2 var(--f-head);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.tag.dark{background:var(--ink)}.tag.dark>span{color:#fff}
.tag.white{background:#fff}

/* header */
.top{position:sticky;top:0;z-index:50;background:rgba(33,40,48,.97);backdrop-filter:blur(8px);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.top .logo img{height:44px;width:auto}
.menu{display:flex;gap:22px;list-style:none;margin:0;padding:0;font:700 14px/1 var(--f-head);text-transform:uppercase;letter-spacing:.1em}
.menu a{text-decoration:none;color:#fff}
.menu a:hover{color:var(--amb)}
.top-r{display:flex;align-items:center;gap:10px}
.langs{display:flex;gap:2px;background:var(--ink2);padding:3px;flex:none}
.langs button{border:0;background:transparent;color:#fff;font:700 13px/1 var(--f-head);letter-spacing:.06em;padding:8px 9px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--amb);color:var(--ink)}
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:10px;font:800 16px/1 var(--f-head);text-transform:uppercase;letter-spacing:.1em;padding:15px 26px;text-decoration:none;background:var(--amb);color:var(--ink);border:2px solid var(--amb);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:#fff;border-color:#fff;clip-path:none}
.top .btn{padding:12px 20px;font-size:14px}
.burger{display:none;background:none;border:0;padding:8px;cursor:pointer}
.burger span{display:block;width:24px;height:3px;background:#fff;margin:4px 0}
@media (max-width:1100px){
  .menu{display:none;position:absolute;top:68px;left:0;right:0;background:var(--ink);flex-direction:column;gap:0;padding:8px 24px 16px}
  .menu.open{display:flex}.menu a{display:block;padding:12px 0}
  .burger{display:block}.top .btn{display:none}
}
@media (max-width:480px){.top .logo img{height:34px}.langs button{padding:7px 6px;font-size:12px}}

/* hero */
.hero{background:var(--ink);color:#fff;padding-block:64px 150px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(56px,9vw,118px);font-weight:800;text-transform:uppercase;line-height:.86;color:#fff;margin-block:18px 18px}
.hero h1 span{display:block;color:var(--amb)}
.hero .sub{font:700 17px/1.4 var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:#fff}
.hero p.text{margin-top:14px;max-width:32em;font-size:17px;color:var(--soft)}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.panels{position:relative;height:520px}
.panels img{position:absolute;top:0;height:100%;width:38%;object-fit:cover;clip-path:polygon(26% 0,100% 0,74% 100%,0 100%)}
.panels img:nth-child(1){left:0;background:#fff;object-fit:contain;padding:40px 20px 40px 40px}
.panels img:nth-child(2){left:31%}
.panels img:nth-child(3){left:62%}
.hero .band{position:absolute;left:0;right:0;bottom:40px;height:90px;background:var(--amb);clip-path:polygon(0 60%,100% 0,100% 36%,0 96%)}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr}.panels{height:360px}.hero{padding-block:44px 130px}}
@media (max-width:480px){.panels{height:280px}}

/* commitments */
.commit{margin-top:-70px;position:relative;z-index:2}
.commit .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cm{padding:28px 30px;display:grid;gap:8px;box-shadow:0 14px 40px rgba(0,0,0,.12)}
.cm.y{background:var(--amb);color:var(--ink)}
.cm.d{background:var(--ink2);color:#fff;border:2px solid var(--amb)}
.cm .t{display:flex;align-items:center;gap:12px;font:800 clamp(28px,3.4vw,38px)/1 var(--f-head);text-transform:uppercase}
.cm.d .t{color:var(--amb)}
.cm svg{width:30px;height:30px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cm .loc{font:700 18px/1.4 "Sarabun","Noto Sans JP","Noto Sans SC",sans-serif}
.cm p{font-size:15px}
.cm.y p{color:var(--ink)}.cm.d p{color:var(--soft)}
.commit .eyebrow{margin-bottom:14px}
@media (max-width:760px){.commit .grid{grid-template-columns:1fr}}

/* generic */
.sec{padding-block:96px}
.sec.light{background:var(--light)}
.sec.dark{background:var(--ink)}
.slant-top{clip-path:polygon(0 70px,100% 0,100% 100%,0 100%);padding-top:150px}
@media (max-width:700px){.sec{padding-block:64px}.slant-top{clip-path:polygon(0 36px,100% 0,100% 100%,0 100%);padding-top:100px}}
.sec-head{margin-bottom:44px}

/* about */
.about{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.about .paras{display:grid;gap:14px;margin-top:18px}
.about .lead{font:600 20px/1.45 var(--f-body);color:var(--ink)}
.slant-photo{position:relative;aspect-ratio:4/5;max-height:520px;width:100%}
.slant-photo img{width:100%;height:100%;object-fit:cover;clip-path:polygon(18% 0,100% 0,100% 100%,0 100%)}
.slant-photo::before{content:"";position:absolute;left:-4%;top:0;bottom:0;width:22%;background:var(--amb);clip-path:polygon(72% 0,100% 0,28% 100%,0 100%)}
.vm{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:56px}
.vm div{padding:28px;display:grid;gap:12px}
.vm .v{background:var(--ink)}.vm .v p{color:#fff;font-size:17px;font-weight:500}
.vm .m{background:var(--light)}.vm .m p{color:var(--ink);font-size:17px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:44px}
.stat{border-left:1px solid var(--line);padding-left:20px}
.stat:first-child{border:0;padding:0}
.stat b{display:block;font:800 48px/1 var(--f-head);color:var(--ink)}
.stat small{font-size:14px;font-weight:600;color:var(--mut)}
@media (max-width:900px){.about{grid-template-columns:1fr}.slant-photo{max-width:440px}.vm{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){border:0;padding:0}}

/* services */
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.svc{background:#fff;border:1px solid var(--line);padding:26px;display:grid;gap:10px;align-content:start}
.ib{width:52px;height:52px;background:var(--amb);transform:skewX(-12deg);display:grid;place-items:center}
.ib svg{transform:skewX(12deg);width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.svc h3{font-size:24px;font-weight:700;margin-top:6px}
.svc p{font-size:15px}
@media (max-width:900px){.svc-grid{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.svc-grid{grid-template-columns:1fr}}

/* process + why */
.pw{display:grid;grid-template-columns:1.1fr .9fr;gap:48px}
.steps{list-style:none;margin:24px 0 0;padding:0;counter-reset:s}
.steps li{position:relative;display:grid;grid-template-columns:50px 1fr;gap:18px;padding-bottom:26px}
.steps li::before{counter-increment:s;content:counter(s,decimal-leading-zero);width:50px;height:50px;background:var(--amb);color:var(--ink);display:grid;place-items:center;font:800 20px/1 var(--f-head)}
.steps li:not(:last-child)::after{content:"";position:absolute;left:24px;top:54px;bottom:4px;width:2px;background:#3A4452}
.steps h3{font-size:22px;font-weight:700;color:#fff}
.steps p{font-size:15px;margin-top:4px}
.why{background:var(--ink2);padding:32px;display:grid;gap:20px;align-content:start}
.why h3.big{font-size:36px;font-weight:800;text-transform:uppercase;color:#fff}.why h3.big span{color:var(--amb)}
.wy{display:grid;grid-template-columns:28px 1fr;gap:14px}
.wy i{width:28px;height:28px;background:var(--amb);display:grid;place-items:center}
.wy i svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.wy h4{margin:0;font:700 20px/1.2 var(--f-head);color:#fff}
.wy p{font-size:14.5px;margin-top:3px}
.procs{margin-top:56px}
.procs h3{font-size:32px;font-weight:800;text-transform:uppercase;color:#fff}.procs h3 span{color:var(--amb)}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.chips span{border:1.5px solid var(--amb);transform:skewX(-12deg);padding:8px 16px}
.chips span b{display:block;transform:skewX(12deg);font-weight:600;font-size:15px;color:#fff}
@media (max-width:900px){.pw{grid-template-columns:1fr}}

/* projects */
.feat{display:grid;grid-template-columns:1.1fr .9fr;background:var(--ink);margin-bottom:28px;overflow:hidden}
.feat .info{padding:40px;display:grid;gap:14px;align-content:start}
.feat h3{font-size:clamp(40px,5vw,62px);font-weight:800;text-transform:uppercase;color:#fff;line-height:.92}
.feat p{color:var(--soft);font-size:16px}
.feat .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:8px}
.feat .fact{background:var(--ink2);padding:16px}
.feat .fact b{display:block;font:800 30px/1 var(--f-head);color:var(--amb);overflow-wrap:anywhere}
.feat .fact small{font-size:13px;color:var(--soft)}
.feat .media{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#fff;padding:0}
.feat .media .shot button{aspect-ratio:auto;height:100%;min-height:260px}
@media (max-width:900px){.feat{grid-template-columns:1fr}.feat .info{padding:28px}}
.proj-list{display:grid;gap:22px}
.proj{display:grid;grid-template-columns:300px 1fr;gap:30px;padding:26px;background:#fff;border:1px solid var(--line)}
.proj .num{font:700 14px/1 var(--f-head);letter-spacing:.2em;color:var(--amb-d);text-transform:uppercase}
.proj h3{font-size:30px;font-weight:800;margin-block:8px 10px}
.proj p{font-size:15.5px}
.details{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px}
.details li{position:relative;padding-left:20px}
.details li::before{content:"";position:absolute;left:0;top:.55em;width:10px;height:10px;background:var(--amb);transform:skewX(-16deg)}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;min-width:0}
.shot{margin:0;min-width:0}
.shot button{all:unset;cursor:zoom-in;display:block;width:100%;aspect-ratio:3/4;background:var(--light);overflow:hidden;position:relative}
.shot img{width:100%;height:100%;object-fit:contain;padding:8px;transition:transform .3s}
.shot.photo img{object-fit:cover;padding:0}
.shot button:hover img{transform:scale(1.04)}
.shot figcaption{font:700 12px/1.3 var(--f-head);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:8px}
.shot.vid button{cursor:pointer;background:var(--ink)}
.shot.vid img{object-fit:cover;padding:0;opacity:.8}
.play{position:absolute;inset:0;margin:auto;width:56px;height:56px;background:var(--amb);clip-path:polygon(0 0,100% 50%,0 100%);transform:translateX(4px)}
.shot.vid figcaption{color:var(--amb-d)}
.stage{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:20px}
.stage .arr{color:var(--amb);font-weight:800}
.note{font-size:14px;color:var(--mut);font-style:italic;margin-top:18px}
@media (max-width:900px){.proj{grid-template-columns:1fr}}

/* sourcing */
.src-cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.sc{background:#fff;border:1px solid var(--line);padding:24px;display:grid;grid-template-columns:52px 1fr;gap:18px}
.sc h3{font-size:24px;font-weight:800}
.sc p{font-size:15px;margin-top:6px}
.retro{background:#fff;border:1px solid var(--line);border-top:5px solid var(--amb);padding:28px;margin-top:22px}
.retro-h{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.retro-h h3{font-size:30px;font-weight:800;text-transform:uppercase}
.retro-h .tag{margin-left:auto}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px 26px;margin:20px 0 22px;padding:0;list-style:none}
.checks li{display:grid;grid-template-columns:24px 1fr;gap:10px;color:var(--ink);font-weight:500}
.checks li i{width:24px;height:24px;background:var(--amb);display:grid;place-items:center}
.checks li i svg{width:14px;height:14px;stroke:var(--ink);fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.ba{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.ba .shot{position:relative}.ba .shot button{aspect-ratio:3/4}
.ba .lbl{position:absolute;left:10px;top:10px;z-index:1}
.cap{font:700 13px/1.4 var(--f-head);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:14px}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:22px;list-style:none;padding:0;counter-reset:s}
.how li::before{counter-increment:s;content:counter(s,decimal-leading-zero);width:44px;height:44px;background:var(--amb);color:var(--ink);display:grid;place-items:center;font:800 18px/1 var(--f-head);margin-bottom:12px}
.how h4{margin:0;font:700 20px/1.2 var(--f-head);color:#fff}
.how p{font-size:14.5px;margin-top:4px}
@media (max-width:900px){.src-cards,.checks{grid-template-columns:1fr}.ba{grid-template-columns:1fr 1fr}.how{grid-template-columns:1fr 1fr}.retro-h .tag{margin-left:0}}

/* portfolio */
.grp{margin-top:64px}.grp:first-of-type{margin-top:0}
.grp h3{font-size:clamp(30px,4vw,44px);font-weight:800;text-transform:uppercase}
.grp > p{max-width:44em;margin-top:8px}
.gallery{display:grid;gap:18px;grid-template-columns:repeat(4,1fr);margin-top:24px}
.g-item{margin:0}
.g-item button{all:unset;cursor:zoom-in;display:block;width:100%;aspect-ratio:4/5;background:#fff;border:1px solid var(--line);overflow:hidden}
.g-item img{width:100%;height:100%;object-fit:contain;padding:12px;transition:transform .3s}
.g-item button:hover img{transform:scale(1.05)}
.g-item figcaption{display:grid;grid-template-columns:12px 1fr;gap:10px;font:700 18px/1.2 var(--f-head);color:var(--ink);margin-top:12px}
.g-item figcaption::before{content:"";width:12px;height:12px;background:var(--amb);transform:skewX(-16deg);margin-top:4px}
.gallery.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){.gallery{grid-template-columns:repeat(3,1fr)}}
@media (max-width:600px){.gallery{grid-template-columns:1fr 1fr}}

/* platforms */
.plat-groups{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.pg{border:1px solid var(--line);padding:24px;background:#fff;min-width:0}
.pg-h{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.pg h3{font-size:22px;font-weight:700}
.pg ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.pg li{font-weight:600;font-size:14.5px;color:var(--ink);background:var(--light);padding:8px 14px}
@media (max-width:900px){.plat-groups{grid-template-columns:1fr}}

/* customers */
.logos{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.logos div{background:#fff;border:1px solid var(--line);height:120px;display:grid;place-items:center;padding:20px}
.logos img{max-height:80px;width:auto;object-fit:contain}
.si-logos{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px;max-width:760px}
.si-logos div{background:#fff;height:130px;display:grid;place-items:center;padding:20px}
.si-logos img{max-height:90px;width:auto}
@media (max-width:900px){.logos{grid-template-columns:repeat(3,1fr)}}
@media (max-width:600px){.logos,.si-logos{grid-template-columns:1fr 1fr}}
.marquee{overflow:hidden;padding-block:20px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.mq-track{display:flex;width:max-content;animation:mq var(--dur,30s) linear infinite}
.marquee.rev .mq-track{animation-direction:reverse}
.marquee:hover .mq-track{animation-play-state:paused}
.mq-group{display:flex;align-items:center;gap:20px;padding-right:20px}
.mq-item{flex:none;width:230px;height:120px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:18px}
.mq-item img{display:block;width:auto;height:auto;max-width:100%;max-height:100%}
.on-dark .mq-item{border:0}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (max-width:600px){.mq-item{width:170px;height:92px;padding:14px}.mq-group{gap:14px;padding-right:14px}}

/* organization */
.org{margin-top:10px}
.boss{display:flex;justify-content:center;flex-wrap:wrap;gap:20px;align-items:center}
.boss .card{display:flex;background:var(--ink);min-width:340px}
.boss .card img{width:130px;height:156px;object-fit:cover;object-position:top}
.boss .card div{padding:18px 22px;display:grid;gap:6px;align-content:center}
.boss .card b{font:800 28px/1 var(--f-head);color:#fff}
.boss .card small{color:var(--soft);font-size:13.5px}
.staff{border:1.5px solid var(--ink);background:var(--light);padding:10px 16px;font:700 15px/1.3 var(--f-head);letter-spacing:.06em;color:var(--ink);text-transform:uppercase}
.vline{width:2px;height:36px;background:var(--ink);margin:0 auto}
.depts{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;border-top:2px solid var(--ink);padding-top:22px;position:relative}
.dept h4{margin:0;background:var(--amb);color:var(--ink);font:800 17px/1.1 var(--f-head);text-transform:uppercase;text-align:center;padding:12px 8px}
.mem{background:#fff;border:1px solid var(--line);border-top:0;padding:18px 10px;text-align:center;display:grid;gap:6px;justify-items:center}
.mem img{width:104px;height:104px;border-radius:50%;object-fit:cover;object-position:top;border:4px solid var(--amb)}
.mem b{font:800 20px/1 var(--f-head);color:var(--ink);margin-top:4px}
.mem small{font-size:13px;color:var(--mut);line-height:1.4}
.ostats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--ink);margin-top:36px}
.ostats div{display:flex;align-items:center;gap:12px;padding:20px 24px}
.ostats b{font:800 40px/1 var(--f-head);color:var(--amb)}
.ostats small{color:#fff;font-size:14px;line-height:1.3}
@media (max-width:900px){.depts{grid-template-columns:repeat(3,1fr)}.ostats{grid-template-columns:1fr 1fr}.boss .card{min-width:0}}
@media (max-width:560px){.depts{grid-template-columns:1fr 1fr}}

/* factory */
.factory-imgs{display:grid;grid-template-columns:1fr 1fr;gap:18px;background:var(--light);padding:18px;margin-top:26px}
.factory-imgs button{all:unset;cursor:zoom-in;display:block;background:#fff;width:100%}
.factory-imgs img{width:100%;aspect-ratio:1.43;object-fit:contain}
.factory-imgs figure{margin:0}
.factory-imgs figcaption{font:700 12px/1.3 var(--f-head);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:8px}
.big-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.big-stats b{display:block;font:800 clamp(44px,6vw,64px)/1 var(--f-head);color:var(--amb);white-space:nowrap}
.big-stats small{font-size:15px;color:var(--soft)}
@media (max-width:700px){.factory-imgs,.big-stats{grid-template-columns:1fr}}

/* contact */
.contact-top{background:var(--amb);clip-path:polygon(0 0,100% 0,100% 72%,0 100%);padding-block:80px 120px}
.contact-top .h2{color:var(--ink)}.contact-top .h2 span{color:#fff}
.contact-top .lead{color:var(--ink);font-weight:500}
.contact-top .eyebrow{color:var(--ink)}.contact-top .eyebrow::before{background:var(--ink)}
.contact{background:var(--ink);margin-top:-60px;padding-block:90px 70px}
.contact .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px}
.c-list{list-style:none;margin:0;padding:0;display:grid;gap:20px}
.c-list li{display:grid;grid-template-columns:44px 1fr;gap:16px;align-items:start}
.c-list i{width:44px;height:44px;background:var(--amb);display:grid;place-items:center}
.c-list i svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.c-list small{display:block;font:700 13px/1.2 var(--f-head);letter-spacing:.16em;text-transform:uppercase;color:var(--amb)}
.c-list span,.c-list a{color:#fff;text-decoration:none;font-size:16px;word-break:break-word}
.c-list a:hover{text-decoration:underline}
.c-extra{display:grid;gap:18px;align-content:start}
.map{display:block;background:#fff;padding:10px}
.map img{width:100%;aspect-ratio:1.3;object-fit:contain}
.map span{display:block;font:700 13px/1 var(--f-head);color:var(--ink);padding:10px 2px 2px;text-transform:uppercase;letter-spacing:.1em}
.qr{display:flex;gap:14px;align-items:center;color:#fff;text-decoration:none}
.qr img{width:120px;background:#fff;padding:8px}
.qr small{font:700 14px/1.3 var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--amb)}
.sign{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px;border-top:1px solid #3A4452;margin-top:56px;padding-top:36px}
.sign img{height:90px;width:auto}
.sign .r{text-align:right}
.sign b{display:block;font:800 clamp(28px,4vw,40px)/1 var(--f-head);letter-spacing:.08em;color:var(--amb)}
.sign span{font:700 15px/1.4 var(--f-head);letter-spacing:.14em;color:#fff;text-transform:uppercase}
@media (max-width:820px){.contact .grid{grid-template-columns:1fr}.sign .r{text-align:left}}
footer{background:#191E25;color:rgba(255,255,255,.6);font-size:13px;padding-block:20px calc(20px + env(safe-area-inset-bottom,0px))}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(15,17,22,.92);display:grid;place-items:center;padding:24px}
.lb img{max-width:min(1100px,100%);max-height:84vh;object-fit:contain;background:#fff}
.lb video{max-width:min(1100px,100%);max-height:84vh;background:#000;display:block;margin:0 auto}
.lb p{color:#fff;text-align:center;font:700 15px/1.4 var(--f-head);letter-spacing:.06em;margin-top:12px}
.lb button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:18px;background:var(--amb);color:var(--ink);border:0;width:46px;height:46px;font:800 24px/1 var(--f-head);cursor:pointer}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="content.js"></script>
<script>
(function(){
  var ICONS = {
    design:'<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 22V12M21 7l-9 5-9-5"/>',
    electric:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',

    build:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
    install:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
    partner:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
    robot:'<rect x="5" y="8" width="14" height="11" rx="2"/><path d="M12 4v4M9 13h.01M15 13h.01M3 13v3M21 13v3"/>',
    shield:'<path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
    plug:'<path d="M9 2v6M15 2v6"/><path d="M6 8h12v3a6 6 0 0 1-12 0V8z"/><path d="M12 17v5"/>',
    search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>',
    compare:'<rect x="3" y="5" width="7" height="14" rx="1"/><rect x="14" y="5" width="7" height="14" rx="1"/><path d="M5.5 9h2M5.5 12h2M16.5 9h2M16.5 12h2"/>',
    refresh:'<path d="M20 11a8 8 0 0 0-14.5-4.5L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.5 4.5L20 16"/><path d="M20 20v-4h-4"/>',

    mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
    pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
    fb:'<path d="M15 3h-2.5A3.5 3.5 0 0 0 9 6.5V10H6.5v3.5H9V21h3.5v-7.5H15l.5-3.5h-3V7a1 1 0 0 1 1-1H15V3z"/>',
    doc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>'
  };
  var LANGS = [
    { code:"en", html:"en", label:"EN" }, { code:"th", html:"th", label:"TH" },
    { code:"ja", html:"ja", label:"JP" }, { code:"zh", html:"zh-CN", label:"CN" }
  ];
  var UI = {
    en:{s1:"3D Design",s2:"Built by VPK",s3:"In Operation",video:"Video",about:"About",services:"Services",projects:"Projects",sourcing:"Retrofit",portfolio:"Portfolio",customers:"Customers",team:"Team",contact:"Contact",project:"Project",featured:"Featured project",address:"Address",phone:"Telephone",email:"Email",facebook:"Facebook",tax:"Tax ID",line:"LINE — scan to chat",map:"Open in Google Maps →",menu:"Menu",close:"Close",lang:"Language",before:"Before",after:"After",watch:"Watch the overhaul",cta2:"See our projects",factory:"New Factory"},
    th:{s1:"แบบ 3D",s2:"สร้างโดย VPK",s3:"ใช้งานจริง",video:"วิดีโอ",about:"เกี่ยวกับเรา",services:"บริการ",projects:"ผลงาน",sourcing:"อัปเกรดเครื่อง",portfolio:"รวมผลงาน",customers:"ลูกค้า",team:"ทีมงาน",contact:"ติดต่อเรา",project:"ผลงานที่",featured:"ผลงานเด่น",address:"ที่อยู่",phone:"โทรศัพท์",email:"อีเมล",facebook:"Facebook",tax:"เลขประจำตัวผู้เสียภาษี",line:"LINE — สแกนเพื่อแชท",map:"เปิดใน Google Maps →",menu:"เมนู",close:"ปิด",lang:"ภาษา",before:"ก่อน",after:"หลัง",watch:"ดูวิดีโองานโอเวอร์ฮอล",cta2:"ดูผลงานของเรา",factory:"โรงงานใหม่"},
    ja:{s1:"3D設計",s2:"VPK製作",s3:"稼働中",video:"動画",about:"会社概要",services:"事業内容",projects:"実績",sourcing:"レトロフィット",portfolio:"ポートフォリオ",customers:"取引先",team:"組織",contact:"お問い合わせ",project:"実績",featured:"注目の実績",address:"住所",phone:"電話",email:"メール",facebook:"Facebook",tax:"納税者番号",line:"LINE — スキャンしてチャット",map:"Google マップで開く →",menu:"メニュー",close:"閉じる",lang:"言語",before:"施工前",after:"施工後",watch:"オーバーホール動画を見る",cta2:"実績を見る",factory:"新工場"},
    zh:{s1:"3D设计",s2:"VPK制造",s3:"实际运行",video:"视频",about:"关于我们",services:"服务",projects:"项目",sourcing:"设备改造",portfolio:"作品集",customers:"客户",team:"团队",contact:"联系我们",project:"项目",featured:"精选项目",address:"地址",phone:"电话",email:"邮箱",facebook:"Facebook",tax:"税号",line:"LINE — 扫码聊天",map:"在 Google 地图中打开 →",menu:"菜单",close:"关闭",lang:"语言",before:"改造前",after:"改造后",watch:"观看大修视频",cta2:"查看我们的项目",factory:"新工厂"}
  };
  function pickLang(){
    var q = (location.search.match(/[?&]lang=(en|th|ja|zh)/) || [])[1]; if (q) return q;

    var n = (navigator.language || "en").toLowerCase();
    if (n.indexOf("th")===0) return "th"; if (n.indexOf("ja")===0) return "ja"; if (n.indexOf("zh")===0) return "zh";
    return "en";
  }
  var lang = pickLang(), U = UI[lang], lastSite = null;
  function isML(o){ return o && typeof o==="object" && !Array.isArray(o) && "en" in o && Object.keys(o).every(function(k){ return /^(en|th|ja|zh)$/.test(k); }); }
  function localize(o){
    if (isML(o)) return (o[lang] != null && String(o[lang]).trim() !== "") ? o[lang] : o.en;
    if (Array.isArray(o)) return o.map(localize);
    if (o && typeof o==="object"){ var r={}; for (var k in o) r[k]=localize(o[k]); return r; }
    return o;
  }
  function setLang(c){
    lang = c; U = UI[c];
    try { localStorage.setItem("vpk-lang", c); } catch(e) {}
    try { var u = new URL(location.href); u.searchParams.set("lang", c); history.replaceState(null, "", u); } catch(e) {}
    var y = window.scrollY; render(lastSite); window.scrollTo(0, y);
  }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function svg(n){ return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[n]||ICONS.build)+'</svg>'; }
  function ib(n){ return '<i class="ib">'+svg(n)+'</i>'; }
  function arr(a){ return Array.isArray(a) ? a : []; }
  function head(o, eb){ return (eb?'<span class="eyebrow">'+esc(eb)+'</span>':'')+'<h2 class="h2">'+esc(o.title1)+'<span>'+esc(o.title2)+'</span></h2>'; }
  function tag(t, cls){ return '<span class="tag '+(cls||'')+'"><span>'+esc(t)+'</span></span>'; }
  function zoomImg(src, cap){ return '<button type="button" data-zoom="'+esc(src)+'" data-cap="'+esc(cap)+'" aria-label="'+esc(cap)+'"><img loading="lazy" src="'+esc(src)+'" alt="'+esc(cap)+'"></button>'; }
  function vidBtn(v, cap){ return '<figure class="shot vid"><button type="button" data-video="'+esc(v.src)+'" data-cap="'+esc(cap)+'" aria-label="'+esc(U.video+': '+cap)+'">'+(v.poster?'<img loading="lazy" src="'+esc(v.poster)+'" alt="">':'')+'<span class="play" aria-hidden="true"></span></button><figcaption>'+esc(v.caption||U.video)+'</figcaption></figure>'; }

  function render(S){
    if(!S){ document.getElementById("app").innerHTML = '<p style="padding:40px">content.js not found</p>'; return; }
    lastSite = S;
    var LG = LANGS.filter(function(x){ return x.code===lang; })[0] || LANGS[0];
    document.documentElement.lang = LG.html;
    S = localize(S);
    var C=S.company||{}, H=S.hero||{}, CM=S.commitments||{}, A=S.about||{}, SV=S.services||{}, P=S.projects||{}, SR=S.sourcing||{}, PF=S.portfolio||{}, PL=S.platforms||{}, CU=S.customers||{}, T=S.team||{}, F=S.factory||{}, CT=S.contact||{};
    var h = '';

    h += '<header class="top"><div class="wrap">'
      + '<a class="logo" href="#home"><img src="'+esc(C.logoOnDark||C.logo)+'" alt="'+esc(C.name)+'"></a>'
      + '<ul class="menu" id="menu">'
      + ['about','services','projects','sourcing','portfolio','customers','team','contact'].map(function(k){ return '<li><a href="#'+k+'">'+U[k]+'</a></li>'; }).join('') + '</ul>'

      + '<button class="burger" id="burger" aria-label="'+U.menu+'" aria-expanded="false"><span></span><span></span><span></span></button></div>'

    // hero

      + '<span class="eyebrow">'+esc(H.eyebrow)+'</span>'
      + '<h1>'+esc(H.titleLine1)+'<span>'+esc(H.titleLine2)+'</span></h1>'
      + '<p class="sub">'+esc(H.subtitle)+'</p><p class="text">'+esc(H.text)+'</p>'
      + '<div class="cta"><a class="btn" href="#contact">'+esc(H.buttonText)+'</a><a class="btn ghost" href="#projects">'+esc(H.button2Text)+'</a></div></div>'
      + '<div class="panels" aria-hidden="true">' + arr(H.panels).map(function(p){ return '<img src="'+esc(p)+'" alt="">'; }).join('') + '</div>'
      + '</div><div class="band" aria-hidden="true"></div></section>';

    // commitments

        return '<div class="cm '+(i?'d':'y')+'"><div class="t">'+svg(c.icon)+'<span>'+esc(c.title)+'</span></div>'
          + (c.local && c.local !== c.title && lang!=="en" ? '<div class="loc">'+esc(c.local)+'</div>' : (lang==="en" && c.local ? '' : ''))
          + '<p>'+esc(c.text)+'</p></div>'; }).join('') + '</div></div></section>';

    // about
    h += '<section class="sec" id="about"><div class="wrap"><div class="about"><div>'
      + head(A, U.about) + '<p class="lead">'+esc(A.lead)+'</p><div class="paras">'

      + (A.image ? '<div class="slant-photo"><img src="'+esc(A.image)+'" alt="VPK Innovation office"></div>' : '')
      + '</div>'
      + '<div class="vm"><div class="v">'+tag(A.visionLabel)+'<p>'+esc(A.vision)+'</p></div><div class="m">'+tag(A.missionLabel,'dark')+'<p>'+esc(A.mission)+'</p></div></div>'
      + '<div class="stats">' + arr(A.stats).map(function(s){ return '<div class="stat"><b>'+esc(s.value)+'</b><small>'+esc(s.label)+'</small></div>'; }).join('') + '</div>'
      + '</div></section>';

    // services
    h += '<section class="sec light" id="services"><div class="wrap"><div class="sec-head">'+head(SV, U.services)+'<p class="lead">'+esc(SV.lead)+'</p></div>'

    h += '<section class="sec dark slant-top on-dark"><div class="wrap"><div class="pw"><div><span class="eyebrow">'+esc(SV.processTitle)+'</span><ol class="steps">'

    // projects
    function shots(p){

    }
    var items = arr(P.items), feat = items.filter(function(p){ return p.featured; })[0], rest = items.filter(function(p){ return !p.featured; });
    h += '<section class="sec" id="projects"><div class="wrap"><div class="sec-head">'+head(P, U.projects)+'<p class="lead">'+esc(P.lead)+'</p>'
      + '<div class="stage">'+tag(U.s1,'dark')+'<span class="arr">→</span>'+tag(U.s2,'dark')+'<span class="arr">→</span>'+tag(U.s3)+'</div></div>';
    if (feat){
      h += '<article class="feat"><div class="info">'+tag(U.featured+(feat.status?' · '+feat.status:''))+'<h3>'+esc(feat.name)+'</h3><p>'+esc(feat.text)+'</p>'
        + '<div class="facts">'+arr(feat.facts).map(function(f){ return '<div class="fact"><b>'+esc(f.value)+'</b><small>'+esc(f.label)+'</small></div>'; }).join('')+'</div></div>'
        + '<div class="media shots">'+shots(feat)+'</div></article>';
    }
    h += '<div class="proj-list">' + rest.map(function(p,i){
        return '<article class="proj"><div><span class="num">'+U.project+' '+String(i+1).padStart(2,"0")+'</span><h3>'+esc(p.name)+'</h3><p>'+esc(p.text)+'</p>'
          + (p.details && String(p.details).trim() ? '<ul class="details">'+String(p.details).split(/\n+/).filter(function(x){return x.trim();}).map(function(x){ return '<li>'+esc(x.replace(/^[-•*]\s*/,''))+'</li>'; }).join('')+'</ul>' : '')
          + '</div><div class="shots">'+shots(p)+'</div></article>'; }).join('') + '</div>'
      + (P.note ? '<p class="note">'+esc(P.note)+'</p>' : '') + '</div></section>';

    // sourcing & retrofit
    h += '<section class="sec light" id="sourcing"><div class="wrap"><div class="sec-head">'+head(SR, U.sourcing)+'<p class="lead">'+esc(SR.lead)+'</p></div>'
      + '<div class="src-cards">' + arr(SR.cards).map(function(c){ return '<div class="sc">'+ib(c.icon)+'<div><h3>'+esc(c.title)+'</h3><p>'+esc(c.text)+'</p></div></div>'; }).join('') + '</div>'
      + '<div class="retro"><div class="retro-h">'+ib('refresh')+'<h3>'+esc(SR.retrofitTitle)+'</h3>'+tag(SR.retrofitTag,'dark')+'</div>'
      + '<ul class="checks">' + arr(SR.checklist).map(function(c){ return '<li><i>'+svg('check')+'</i><span>'+esc(c)+'</span></li>'; }).join('') + '</ul>'
      + '<div class="ba">' + arr(SR.images).map(function(im){ var lb = im.label==='after'?U.after:U.before; return '<figure class="shot photo"><span class="lbl">'+tag(lb, im.label==='after'?'':'white')+'</span>'+zoomImg(im.src, SR.retrofitTitle+' — '+lb)+'</figure>'; }).join('')
      + (SR.video ? vidBtn({src:SR.video.src, poster:SR.video.poster, caption:U.watch}, SR.caption) : '') + '</div>'
      + '<p class="cap">'+esc(SR.caption)+'</p></div></div></section>';
    h += '<section class="sec dark on-dark" style="padding-block:64px"><div class="wrap"><span class="eyebrow">'+esc(SR.stepsTitle)+'</span><ol class="how">'
      + arr(SR.steps).map(function(s){ return '<li><h4>'+esc(s.title)+'</h4><p>'+esc(s.text)+'</p></li>'; }).join('') + '</ol></div></section>';

    // portfolio
    h += '<section class="sec" id="portfolio"><div class="wrap"><div class="sec-head">'+head(PF, U.portfolio)+'<p class="lead">'+esc(PF.lead)+'</p></div>'
      + arr(PF.groups).map(function(g){ return '<div class="grp"><h3>'+esc(g.title)+'</h3><p>'+esc(g.text)+'</p><div class="gallery'+(arr(g.items).length===6?' three':'')+'">'
          + arr(g.items).map(function(it){ return '<figure class="g-item">'+zoomImg(it.image,it.name)+'<figcaption>'+esc(it.name)+'</figcaption></figure>'; }).join('') + '</div></div>'; }).join('')
      + '</div></section>';

    // platforms
    if (arr(PL.groups).length){
      h += '<section class="sec light" id="platforms"><div class="wrap"><div class="sec-head">'+head(PL)+'<p class="lead">'+esc(PL.lead)+'</p></div><div class="plat-groups">'
        + arr(PL.groups).map(function(g){ return '<div class="pg"><div class="pg-h">'+ib(g.icon)+'<h3>'+esc(g.title)+'</h3></div><ul>'
          + arr(g.items).map(function(it){ return '<li>'+esc(it.name)+'</li>'; }).join('') + '</ul></div>'; }).join('') + '</div></div></section>';
    }

    // customers — logo rows scroll in opposite directions
    function marquee(list, reverse){
      list = arr(list).filter(function(l){ return l.image || l.name; });
      if (!list.length) return '';
      var one = list.map(function(l){ return '<div class="mq-item" title="'+esc(l.name)+'">'+(l.image?'<img src="'+esc(l.image)+'" alt="'+esc(l.name)+'">':'<b>'+esc(l.name)+'</b>')+'</div>'; }).join('');
      var rep = Math.max(1, Math.ceil(12 / list.length)), group = '';
      for (var r = 0; r < rep; r++) group += one;
      var secs = Math.max(18, list.length * rep * 2.6);
      return '<div class="marquee'+(reverse?' rev':'')+'" style="--dur:'+secs+'s"><div class="mq-track"><div class="mq-group">'+group+'</div><div class="mq-group" aria-hidden="true">'+group+'</div></div></div>';
    }
    h += '<section class="sec" id="customers"><div class="wrap"><div class="sec-head">'+head(CU, U.customers)+'<p class="lead">'+esc(CU.lead)+'</p></div>'
      + '</div>' + marquee(CU.logos, false) + '</section>';
    h += '<section class="sec dark slant-top on-dark"><div class="wrap"><h3 class="h2" style="font-size:clamp(32px,4.4vw,48px)">'+esc(CU.partnerTitle)+'</h3><p class="lead">'+esc(CU.partnerText)+'</p>'
      + '</div>' + marquee(CU.partners, true) + '</section>';

    // organization
    var mem = arr(T.members), boss = mem[0];
    h += '<section class="sec" id="team"><div class="wrap"><div class="sec-head">'+head(T, U.team)+'<p class="lead">'+esc(T.lead)+'</p></div><div class="org">'
      + (boss ? '<div class="boss"><div class="card">'+(boss.photo?'<img src="'+esc(boss.photo)+'" alt="'+esc(boss.name)+'">':'')+'<div>'+tag(boss.role)+'<b>'+esc(boss.name)+'</b><small>'+esc(boss.education)+'</small></div></div>'
        + (T.staff?'<div class="staff">'+esc(T.staff)+'</div>':'')+'</div><div class="vline"></div>' : '')
      + '<div class="depts">' + arr(T.depts).map(function(d){ return '<div class="dept"><h4>'+esc(d.name)+'</h4>'
          + mem.filter(function(m){ return m.dept===d.id; }).map(function(m){ return '<div class="mem">'+(m.photo?'<img loading="lazy" src="'+esc(m.photo)+'" alt="'+esc(m.name)+'">':'')+'<b>'+esc(m.name)+'</b><small>'+esc(m.education)+'</small></div>'; }).join('') + '</div>'; }).join('') + '</div>'
      + '<div class="ostats">' + arr(T.stats).map(function(s){ return '<div><b>'+esc(s.value)+'</b><small>'+esc(s.label)+'</small></div>'; }).join('') + '</div>'
      + '</div></div></section>';

    // factory
    h += '<section class="sec light" id="factory"><div class="wrap"><div class="sec-head" style="margin-bottom:0">'+head(F, U.factory)+(F.status?'<div style="margin-top:16px">'+tag(F.status)+'</div>':'')+'<p class="lead">'+esc(F.lead)+'</p></div>'
      + '<div class="factory-imgs">' + arr(F.images).map(function(im){ return '<figure>'+zoomImg(im.src, im.caption)+'<figcaption>'+esc(im.caption)+'</figcaption></figure>'; }).join('') + '</div></div></section>';
    h += '<section class="sec dark slant-top on-dark"><div class="wrap big-stats">' + arr(F.stats).map(function(s){ return '<div><b>'+esc(s.value)+'</b><small>'+esc(s.label)+'</small></div>'; }).join('') + '</div></section>';

    // contact
    var tel = String(CT.phoneIntl||CT.phone||"").replace(/[^0-9+]/g,"");
    h += '<section id="contact"><div class="contact-top"><div class="wrap"><span class="eyebrow">'+U.contact+'</span><h2 class="h2">'+esc(CT.title1)+'<span>'+esc(CT.title2)+'</span></h2><p class="lead">'+esc(CT.lead)+'</p></div></div>'
      + '<div class="contact on-dark"><div class="wrap"><div class="grid"><ul class="c-list">'
      + '<li><i>'+svg("pin")+'</i><div><small>'+U.address+'</small><span>'+esc(CT.address)+'</span></div></li>'
      + (CT.phone ? '<li><i>'+svg("phone")+'</i><div><small>'+U.phone+'</small><a href="tel:'+esc(tel)+'">'+esc(CT.phone)+(CT.phoneIntl?' · '+esc(CT.phoneIntl):'')+'</a></div></li>' : '')
      + (CT.email ? '<li><i>'+svg("mail")+'</i><div><small>'+U.email+'</small><a href="mailto:'+esc(CT.email)+'">'+esc(CT.email)+'</a></div></li>' : '')
      + (CT.facebookName ? '<li><i>'+svg("fb")+'</i><div><small>'+U.facebook+'</small>'+(CT.facebookUrl?'<a href="'+esc(CT.facebookUrl)+'" target="_blank" rel="noopener">'+esc(CT.facebookName)+'</a>':'<span>'+esc(CT.facebookName)+'</span>')+'</div></li>' : '')
      + (CT.taxId ? '<li><i>'+svg("doc")+'</i><div><small>'+U.tax+'</small><span>'+esc(CT.taxId)+'</span></div></li>' : '')
      + '</ul><div class="c-extra">'
      + (CT.mapImage ? '<a class="map" href="'+esc(CT.mapUrl||"#")+'" target="_blank" rel="noopener"><img src="'+esc(CT.mapImage)+'" alt="Map to VPK Innovation"><span>'+U.map+'</span></a>' : '')
      + (CT.lineQr ? (CT.lineUrl?'<a class="qr" href="'+esc(CT.lineUrl)+'" target="_blank" rel="noopener">':'<div class="qr">')+'<img src="'+esc(CT.lineQr)+'" alt="LINE QR code"><small>'+U.line+'</small>'+(CT.lineUrl?'</a>':'</div>') : '')
      + '</div></div>'
      + '<div class="sign"><img src="'+esc(C.logoOnDark||C.logo)+'" alt="'+esc(C.name)+'"><div class="r"><b>'+esc(String(C.tagline||"").toUpperCase())+'</b><span>'+esc(C.commitLine)+'</span></div></div>'
      + '</div></div></section>';
    h += '</main><footer><div class="wrap"><span>'+esc((S.footer||{}).text)+'</span><span>'+esc(C.commitLine)+'</span></div></footer>';

    document.getElementById("app").innerHTML = h;
    var b = document.getElementById("burger"), m = document.getElementById("menu");
    b.addEventListener("click", function(){ var o = m.classList.toggle("open"); b.setAttribute("aria-expanded", o); });
    document.querySelectorAll("[data-lang]").forEach(function(btn){ btn.addEventListener("click", function(){ setLang(btn.dataset.lang); }); });
    m.addEventListener("click", function(e){ if(e.target.tagName==="A"){ m.classList.remove("open"); b.setAttribute("aria-expanded", false); } });
  }

  document.addEventListener("click", function(e){
    var z = e.target.closest("[data-zoom]");
    if(z){
      var lb = document.createElement("div"); lb.className = "lb"; lb.setAttribute("role","dialog"); lb.setAttribute("aria-modal","true");
      lb.innerHTML = '<div><img src="'+esc(z.dataset.zoom)+'" alt=""><p>'+esc(z.dataset.cap)+'</p></div><button type="button" aria-label="'+U.close+'">×</button>';
      document.body.appendChild(lb); lb.querySelector("button").focus(); return;
    }
    var v = e.target.closest("[data-video]");
    if(v){
      var lv = document.createElement("div"); lv.className = "lb"; lv.setAttribute("role","dialog"); lv.setAttribute("aria-modal","true");
      lv.innerHTML = '<div><video src="'+esc(v.dataset.video)+'" controls autoplay muted playsinline></video><p>'+esc(v.dataset.cap)+'</p></div><button type="button" aria-label="'+U.close+'">×</button>';
      document.body.appendChild(lv); lv.querySelector("button").focus(); return;
    }
    var lb2 = e.target.closest(".lb"); if(lb2 && e.target.tagName!=="IMG" && e.target.tagName!=="VIDEO") lb2.remove();
  });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape"){ var l=document.querySelector(".lb"); if(l) l.remove(); } });
  window.addEventListener("message", function(e){ if(e.data && e.data.type==="vpk-preview"){ if(e.data.lang && UI[e.data.lang]){ lang=e.data.lang; U=UI[lang]; } var y=window.scrollY; render(e.data.site); window.scrollTo(0,y); } });
  render(window.SITE);
})();
</script>
</body>
</html>
